{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">

                    Add Publication

                </h2>

                <form method="POST"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary">

                        Save Publication

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
