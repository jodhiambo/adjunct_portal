{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-xl-7">

            <div class="card border-0 shadow-lg rounded-4">

                <!-- Header -->
                <div class="card-header bg-primary text-white py-4 rounded-top-4 border-0">

                    <div class="d-flex align-items-center">

                        <div class="bg-white rounded-circle d-flex align-items-center justify-content-center me-3"
                             style="width:60px;height:60px;">

                            <i class="bi bi-journal-plus fs-2 text-primary"></i>

                        </div>

                        <div>

                            <h3 class="fw-bold mb-1">
                                Add Publication
                            </h3>

                            <p class="mb-0 text-white-50">
                                Complete the form below to add a publication to your research profile.
                            </p>

                        </div>

                    </div>

                </div>

                <!-- Form -->
                <div class="card-body p-4 p-lg-5">

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="border-top pt-4 mt-4">

                            <div class="d-flex justify-content-between">

                                <a href="javascript:history.back()"
                                   class="btn btn-outline-secondary">

                                    <i class="bi bi-arrow-left"></i>
                                    Back

                                </a>

                                <button type="submit"
                                        class="btn btn-primary px-4">

                                    <i class="bi bi-save"></i>
                                    Save Publication

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // Style all form controls
    document.querySelectorAll("input, textarea, select").forEach(function(el){

        if(el.type !== "checkbox" && el.type !== "radio" && el.type !== "file"){
            el.classList.add("form-control");
        }

        if(el.tagName === "SELECT"){
            el.classList.remove("form-control");
            el.classList.add("form-select");
        }

        if(el.type === "file"){
            el.classList.add("form-control");
        }

        if(el.type === "checkbox"){
            el.classList.add("form-check-input");
        }

    });

    // Improve paragraph spacing
    document.querySelectorAll("form p").forEach(function(p){
        p.classList.add("mb-4");
    });

    // Style labels
    document.querySelectorAll("label").forEach(function(label){
        label.classList.add("form-label","fw-semibold","mb-2");
    });

});
</script>

{% endblock %}
