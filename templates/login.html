{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-4 text-center">
                    Login
                </h3>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button class="btn btn-success w-100">
                        Login
                    </button>

                </form>

                <p class="mt-3 text-center">
                    Don't have an account?
                    <a href="/signup/">Signup</a>
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
